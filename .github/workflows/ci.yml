name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # Lets the repository tests run (they are skipped without DATABASE_URL).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: genui
          POSTGRES_PASSWORD: genui
          POSTGRES_DB: genui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genui -d genui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://genui:genui@localhost:5432/genui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:api
