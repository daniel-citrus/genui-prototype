services:
  # Development: Vite (web) and tsx watch (API), repo bind-mounted.
  #
  # Both dev services share the `dev_node_modules` volume, so the containers'
  # Linux dependencies never overwrite the host's node_modules. Only `api-dev`
  # runs `npm ci`; `dev` waits for `api-dev` to be healthy, i.e. for the install
  # to finish, so the two never race on it.
  api-dev:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    command: sh -c "npm ci && npm run dev:api"
    environment:
      API_HOST: 0.0.0.0
      DATABASE_URL: postgres://genui:genui@db:5432/genui
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 300s

  dev:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm run dev:web -- --host 0.0.0.0 --port 5173"
    environment:
      API_PROXY_TARGET: http://api-dev:3001
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      api-dev:
        condition: service_healthy

  # Production: the API image, and nginx serving dist/ and proxying /api to it.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://genui:genui@db:5432/genui
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      TRUST_PROXY: "1"
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - api

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genui}
      POSTGRES_DB: ${POSTGRES_DB:-genui}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genui -d genui"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  dev_node_modules:
